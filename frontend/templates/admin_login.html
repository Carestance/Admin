<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareStance Admin Login</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #162033; }
    main { width: min(420px, calc(100% - 40px)); padding: 36px; background: #fff; border: 1px solid #dfe6ef; border-radius: 14px; box-shadow: 0 18px 50px rgba(20, 38, 63, .10); }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { color: #65748a; margin: 0 0 28px; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; font-size: 14px; }
    input { box-sizing: border-box; width: 100%; padding: 12px 13px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    input:focus { outline: 3px solid rgba(45, 108, 223, .18); border-color: #2d6cdf; }
    button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 8px; background: #163b70; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    .error { padding: 11px 12px; border-radius: 8px; background: #fff0f0; color: #a12626; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>CareStance Admin</h1>
    <p>Sign in with your administrator account.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
